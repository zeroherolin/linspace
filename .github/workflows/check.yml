name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y curl openssl openssh-client shellcheck
      - run: make check
      # Lint the rendered scripts that users run with curl | bash. SC2034: the generated
      # asset table defines variables only some scripts read. SC2050: rendered client
      # names make one template guard a constant comparison.
      - run: |
          python3 scripts/cli.py configure --config /tmp/ci-site.json --internal-test --non-interactive \
            --domain ci.example.test --site-name CI --icp-number '' --ssh-public-key-file '' \
            --claude-settings-file config/claude/settings.json --codex-config-file config/codex/config.toml
          python3 scripts/cli.py build --config /tmp/ci-site.json --internal-test
          find dist/linspace-site -type f \( -path '*/site/*' -o -name install-caddy.sh -o -name linspace \) \
            -exec grep -l '^#!/usr/bin/env bash' {} + | xargs shellcheck -s bash -S warning -e SC2034,SC2050
