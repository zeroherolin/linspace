# ---- General ---------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g set-clipboard external
set -s escape-time 10
set -s focus-events on

# ---- Modifier-drag selection -----------------------------------------------
#   iTerm2  : Option = native selection, Shift  = tmux
#   Termius : Shift  = native selection, Option = tmux

bind -T root M-MouseDown1Pane select-pane -t =
bind -T root S-MouseDown1Pane select-pane -t =
bind -T root M-MouseUp1Pane   select-pane -t =
bind -T root S-MouseUp1Pane   select-pane -t =

bind -T root M-MouseDrag1Pane copy-mode -M
bind -T root S-MouseDrag1Pane copy-mode -M

bind -T copy-mode    M-MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode    S-MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi M-MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi S-MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
